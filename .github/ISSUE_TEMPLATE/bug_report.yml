name: Bug report
description: Report a reproducible defect in Mobile DevOps AI
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, tokens, private logs, dSYMs, or personal data.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web frontend
        - Backend API
        - iOS build and quality
        - Android build and quality
        - Crash symbolication
        - CI/CD and release
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js, Xcode, device, browser, and relevant component versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add redacted logs, screenshots, or stack traces. Remove all secrets and personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials, tokens, private logs, and personal data.
          required: true
        - label: This is not a security vulnerability. Security issues must follow SECURITY.md.
          required: true
